[package]
name = "elpian-dart"
version = "0.1.0"
edition = "2021"
description = "Dart/Flutter runtime layer on top of the Elpian VM. Provides the dart:* foundational-library binding surface (dart:ui, dart:typed_data, ...), a Dart numeric tower, and a two-layer capability/resource governor, all serviced over Elpian's askHost pause/resume seam. No JIT: valid for the iOS App Store and compiles to wasm32."

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
js2elpian = { path = "../js2elpian" }
elpian-vm = { path = "../elpian-vm" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
